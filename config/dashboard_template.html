// ─── HELPERS ─────────────────────────────────────────────────────────────────
function calcAdjSpread(airline, scenario) {
  const { trasm, fuelCasm, hedgePct, hedgeTenor } = airline;
  const { jetPctUp } = scenario;
  const rawSpread = trasm - fuelCasm;
  const fuelIncrease = fuelCasm * jetPctUp;
  const tenorDiscount = hedgeTenor > 0 ? Math.max(0, 1 - (24 - hedgeTenor) * 0.008) : 1;
  const hedgedProtection = fuelIncrease * hedgePct * tenorDiscount;
  const netFuelHit = fuelIncrease - hedgedProtection;
  return rawSpread - netFuelHit;
}

function fmtC(v, d=2) { return (v>=0?'+':'')+v.toFixed(d)+'¢'; }
function fmtPct(v) { return Math.round(v*100)+'%'; }

function HedgeBar({pct}) {
  const color = pct >= 0.6 ? '#34d399' : pct >= 0.3 ? '#f97316' : '#ef4444';
  return (
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <div style={{flex:1,height:6,background:'#1e293b',borderRadius:3}}>
        <div style={{height:6,width:`${Math.min(pct*100,100)}%`,background:color,borderRadius:3}}/>
      </div>
      <span className="mono" style={{color,fontSize:11,minWidth:32}}>{fmtPct(pct)}</span>
    </div>
  );
}

function SpreadChip({val}) {
  const color = val < -3 ? '#ef4444' : val < 0 ? '#f97316' : val < 3 ? '#facc15' : '#34d399';
  const bg = val < -3 ? '#2a0808' : val < 0 ? '#1a0e00' : val < 3 ? '#1a1200' : '#001a0e';
  return (
    <span className="mono" style={{background:bg,color,border:`1px solid ${color}33`,borderRadius:4,padding:'2px 6px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>
      {fmtC(val)}

  );
}

// ─── TAB 6: OPERATING METRICS ─────────────────────────────────────────────────
function MetricsTab() {
  const [sortKey, setSortKey] = useState('trasm');
  const [sortAsc, setSortAsc] = useState(false);

  function toggleSort(k) {
    if(sortKey===k) setSortAsc(a=>!a);
    else { setSortKey(k); setSortAsc(false); }
  }
  function arrow(k) {
    if(sortKey!==k) return <span style={{color:'#334155',marginLeft:2}}>⇅</span>;
    return <span style={{marginLeft:2}}>{sortAsc?'▲':'▼'}</span>;
  }

  const sorted = useMemo(()=>{
    return [...AIRLINES].sort((a,b)=>{
      let av = a[sortKey], bv = b[sortKey];
      if(sortKey==='name'||sortKey==='region'||sortKey==='ticker')
        return sortAsc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
      return sortAsc ? av-bv : bv-av;
    });
  },[sortKey,sortAsc]);

  function SortTh({k,label,align='left'}) {
    return (
      <th onClick={()=>toggleSort(k)} style={{cursor:'pointer',userSelect:'none',padding:'8px 8px',background:'#0a0e1a',textAlign:align,fontWeight:600,fontSize:10,color:sortKey===k?'#60a5fa':'#64748b',textTransform:'uppercase',letterSpacing:'0.5px',whiteSpace:'nowrap'}}>
        {label}{arrow(k)}
      </th>
    );
  }

  return (
    <div>
      <MethodBox>
        <strong style={{color:'#94a3b8'}}>Operating Metrics</strong> shows full unit economics for all 14 carriers. EU carriers converted from EUR/ASK using EUR×1.08÷ASK×0.6214. FY2025 data unless otherwise noted.<br/><br/>
        <strong style={{color:'#94a3b8'}}>FX Rates used:</strong> EUR×1.08, GBP×1.26 (USD). ASK→ASM: ×0.6214.<br/><br/>
        <strong style={{color:'#94a3b8'}}>Column definitions:</strong>
        <table style={{width:'100%',margin:'8px 0',fontSize:11,borderCollapse:'collapse'}}>
          <tbody>
            {[
              ['TRASM','Total Revenue per ASM (US¢). FY2025 issuer filings. Delta uses adjusted TRASM excl. Monroe refinery sales.'],
              ['PRASM','Passenger Revenue per ASM (US¢). Fare revenue only; excludes cargo and ancillaries.'],
              ['FUEL CASM','Fuel Cost per ASM (US¢) at FY2025 (pre-conflict) average fuel price.'],
              ['CASM-EX','Non-fuel CASM (US¢): labor, maintenance, airports, admin.'],
              ['CASM','Derived. = Fuel CASM + CASM-ex. Total operating cost per ASM.'],
              ['$/GAL','Pre-conflict average fuel price per US gallon.'],
              ['ASMS(B)','Available Seat Miles (billions). Capacity proxy.'],
              ['LF %','Passenger Load Factor (%) — seats occupied.'],
            ].map(([col,desc])=>(
              <tr key={col}>
                <td style={{padding:'3px 8px',color:'#94a3b8',fontWeight:600,whiteSpace:'nowrap',borderBottom:'1px solid #1e293b',width:80}}>{col}</td>
                <td style={{padding:'3px 8px',color:'#64748b',borderBottom:'1px solid #1e293b'}}>{desc}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </MethodBox>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',minWidth:800}}>
          <thead>
            <tr style={{borderBottom:'1px solid #1e293b'}}>
              <SortTh k="name" label="AIRLINE"/>
              <SortTh k="region" label="RGN"/>
              <SortTh k="ticker" label="TICKER"/>
              <SortTh k="trasm" label="TRASM" align="right"/>
              <SortTh k="prasm" label="PRASM" align="right"/>
              <SortTh k="fuelCasm" label="FUEL CASM" align="right"/>
              <SortTh k="casmEx" label="CASM-EX" align="right"/>
              <SortTh k="casm" label="CASM" align="right"/>
              <SortTh k="fuelGal" label="$/GAL" align="right"/>
              <SortTh k="asm" label="ASMS(B)" align="right"/>
              <SortTh k="loadFactor" label="LF %" align="right"/>
            </tr>
          </thead>
          <tbody>
            {sorted.map((a,i)=>(
              <tr key={a.name} style={{borderBottom:'1px solid #1e293b',background:i%2?'#0a0f1a':'transparent'}}>
                <td style={{padding:'8px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontSize:14}}>{a.flag}</span>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:'#e5e7eb'}}>{a.name}</div>
                      {a.isPrivate && <PrivateBadge/>}
                    </div>
                  </div>
                </td>
                <td style={{padding:'8px'}}><span style={{fontWeight:600,fontSize:10,color:a.region==='NA'?'#3b82f6':'#8b5cf6'}}>{a.region}</span></td>
                <td style={{padding:'8px'}} className="mono"><span style={{fontSize:11,color:'#64748b'}}>{a.ticker}</span></td>
                {[a.trasm, a.prasm, a.fuelCasm, a.casmEx, a.casm].map((v,j)=>(
                  <td key={j} style={{padding:'8px',textAlign:'right'}} className="mono">
                    <span style={{fontSize:12,color:j===2?'#f97316':'#e5e7eb'}}>{v.toFixed(2)}¢</span>
                  </td>
                ))}
                <td style={{padding:'8px',textAlign:'right'}} className="mono"><span style={{fontSize:12,color:'#94a3b8'}}>${a.fuelGal.toFixed(2)}</span></td>

// ─── TAB 7: EVIDENCE & SOURCES ───────────────────────────────────────────────
function ConfBadge({level}) {
  const map = {CONFIRM:{bg:'#001a0e',color:'#34d399',border:'#34d39944'},CAUTION:{bg:'#1a1200',color:'#fbbf24',border:'#fbbf2444'},UNVERIFIED:{bg:'#1a0808',color:'#ef4444',border:'#ef444444'}};
  const s = map[level]||map.UNVERIFIED;
  return <span style={{background:s.bg,color:s.color,border:`1px solid ${s.border}`,borderRadius:4,padding:'1px 5px',fontSize:9,fontWeight:700,letterSpacing:'0.3px'}}>{level}</span>;
}

function EvidenceTab() {
  const [filter, setFilter] = useState('ALL');
  const [expanded, setExpanded] = useState({});
  const toggle = (key) => setExpanded(e=>({...e,[key]:!e[key]}));

  const FIELD_LABELS = {hedgePct:'Hedge %',hedgeTenor:'Tenor',trasm:'TRASM'};
  const FIELDS = ['hedgePct','hedgeTenor','trasm'];

  const stats = useMemo(()=>{
    let c=0,ca=0,u=0;
    GROUNDED_DATA.forEach(g=>FIELDS.forEach(f=>{if(g[f]){const v=g[f].confidence;if(v==='CONFIRM')c++;else if(v==='CAUTION')ca++;else u++;}}));
    return {confirm:c,caution:ca,unverified:u,total:c+ca+u};
  },[]);

  const filtered = filter==='ALL' ? GROUNDED_DATA : GROUNDED_DATA.filter(g=>FIELDS.some(f=>g[f]&&g[f].confidence===filter));

  return (
    <div>
      <MethodBox>
        <strong style={{color:'#94a3b8'}}>Evidence & Sources</strong> shows the provenance of every key metric. Each value is backed by a source document with a verbatim quote. Click any row to expand the full citation.<br/><br/>
        <strong style={{color:'#34d399'}}>CONFIRM</strong> = issuer primary document (10-K, annual report, earnings transcript) &nbsp;
        <strong style={{color:'#fbbf24'}}>CAUTION</strong> = credible secondary source or derived estimate &nbsp;
        <strong style={{color:'#ef4444'}}>UNVERIFIED</strong> = no acceptable source this cycle
      </MethodBox>

      <div style={{display:'flex',gap:8,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
        <span style={{fontSize:11,color:'#64748b',textTransform:'uppercase',letterSpacing:'0.5px'}}>Filter:</span>
        {['ALL','CONFIRM','CAUTION','UNVERIFIED'].map(f=>{
          const count = f==='ALL'?stats.total:stats[f.toLowerCase()];
          const active = filter===f;
          const colors = {ALL:'#60a5fa',CONFIRM:'#34d399',CAUTION:'#fbbf24',UNVERIFIED:'#ef4444'};
          return (
            <button key={f} onClick={()=>setFilter(f)} style={{
              background:active?`${colors[f]}18`:'transparent',border:`1px solid ${active?colors[f]:'#1e293b'}`,
              borderRadius:6,padding:'4px 10px',cursor:'pointer',color:active?colors[f]:'#475569',fontSize:11,fontWeight:600
            }}>{f} ({count})</button>
          );
        })}
        <div style={{marginLeft:'auto',display:'flex',gap:12,fontSize:12}}>
          <span style={{color:'#34d399'}} className="mono">{Math.round(stats.confirm/stats.total*100)}% confirmed</span>
          <span style={{color:'#fbbf24'}} className="mono">{Math.round(stats.caution/stats.total*100)}% caution</span>
          <span style={{color:'#ef4444'}} className="mono">{Math.round(stats.unverified/stats.total*100)}% unverified</span>
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {filtered.map(g=>{
          const airline = AIRLINES.find(a=>a.name===g.name);
          if(!airline) return null;
          return (
            <div key={g.name} style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:8,overflow:'hidden'}}>
              <div style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid #1e293b11'}}>
                <span style={{fontSize:18}}>{airline.flag}</span>
                <div style={{flex:1}}>
                  <span style={{fontWeight:600,fontSize:14,color:'#e5e7eb'}}>{g.name}</span>
                  <span className="mono" style={{fontSize:10,color:'#475569',marginLeft:8}}>{airline.ticker}</span>
                </div>
                <div style={{display:'flex',gap:4}}>
                  {FIELDS.map(f=>g[f]?<ConfBadge key={f} level={g[f].confidence}/>:null)}
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr',gap:0}}>
                {FIELDS.map(f=>{
                  const d = g[f];
                  if(!d) return null;
                  const key = `${g.name}-${f}`;
                  const isOpen = expanded[key];
                  const valDisplay = f==='hedgePct'?fmtPct(d.value):f==='hedgeTenor'?`${d.value} mo`:`${d.value.toFixed(2)}¢`;
                  return (
                    <div key={f} onClick={()=>toggle(key)} style={{padding:'10px 16px',borderTop:'1px solid #1e293b22',cursor:'pointer',background:isOpen?'#0c1120':'transparent',transition:'background 0.15s'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span style={{color:'#60a5fa',fontSize:12,width:6}}>{isOpen?'▾':'▸'}</span>
                        <span style={{fontSize:11,fontWeight:600,color:'#94a3b8',minWidth:60,textTransform:'uppercase'}}>{FIELD_LABELS[f]}</span>
                        <span className="mono" style={{fontSize:13,fontWeight:700,color:'#e5e7eb',minWidth:55}}>{valDisplay}</span>
                        <ConfBadge level={d.confidence}/>
                        <span style={{fontSize:10,color:'#475569',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginLeft:8}}>
                          {d.source_name||'—'}
                        </span>
                        {d.document_date && <span className="mono" style={{fontSize:10,color:'#334155',whiteSpace:'nowrap'}}>{d.document_date}</span>}
                      </div>
                      {isOpen && (
                        <div style={{marginTop:10,marginLeft:14,paddingLeft:12,borderLeft:'2px solid #1e293b'}}>
                          {d.verbatim_quote && (
                            <div style={{fontSize:11,color:'#94a3b8',lineHeight:1.6,fontStyle:'italic',marginBottom:8,background:'#080c14',borderRadius:6,padding:'8px 12px'}}>
                              "{d.verbatim_quote}"
                            </div>
                          )}
                          {d.notes && <div style={{fontSize:10,color:'#475569',marginBottom:6}}>Note: {d.notes}</div>}
                          {d.url && (
                            <a href={d.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:'#60a5fa',textDecoration:'none'}} onClick={e=>e.stopPropagation()}>
                              View source document ↗
                            </a>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
