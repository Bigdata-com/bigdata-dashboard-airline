function calcAdjSpread(airline, scenario) {
  const {trasm,fuelCasm,hedgePct,hedgeTenor} = airline;
  const {jetPctUp} = scenario;
  const rawSpread = trasm - fuelCasm;
  const fuelIncrease = fuelCasm * jetPctUp;
  const tenorDiscount = hedgeTenor > 0 ? Math.max(0, 1 - (24 - hedgeTenor) * 0.008) : 1;
  const hedgedProtection = fuelIncrease * hedgePct * tenorDiscount;
  const netFuelHit = fuelIncrease - hedgedProtection;
  return rawSpread - netFuelHit;
}

const fmt1 = v => v.toFixed(1);
const fmtPct = v => (v*100).toFixed(0)+'%';

function statusBadge(airline, scenario) {
  if(airline.isPrivate && airline.hedgePct === 0) return "PRIVATE";
  if(airline.ticker === "Private" || airline.isPrivate) return "SUB";
  const adj = calcAdjSpread(airline, scenario);
  if(airline.hedgePct === 0) return "UNHEDGED";
  if(adj < 0) return "CAUTION";
  if(airline.hedgePct < 0.3) return "PARTIAL";
  return "HEDGED";
}

}

function TabScatter() {
  const [scenario,setScenario] = useState("current");
  const sc = SCENARIOS.find(s=>s.id===scenario);
  const data = AIRLINES.map(a=>({
    name:a.name,
    flag:a.flag,
    region:a.region,
    x:a.hedgePct*100,
    y:parseFloat(calcAdjSpread(a,sc).toFixed(2)),
    z:Math.round(Math.sqrt(a.asm)*10),
    color:REGION_COLORS[a.region],
  }));

  const CustomDot = (props) => {
    const {cx,cy,payload} = props;
    return <text x={cx} y={cy+4} textAnchor="middle" fontSize={12} fill={payload.color}>{payload.flag}</text>;
  };

  return (
    <div>
      <MethodBox>
        <strong>Risk vs Spread Scatter</strong> plots every airline on two axes: X = hedge coverage (%), Y = Adjusted Spread under the selected scenario. Bubble size = √ASMs (carrier size proxy).<br/><br/>
        Top-right = resilient (well-hedged, positive spread). Bottom-left = most at risk (unhedged, negative spread). The zero line on Y-axis separates profitable from loss-making per ASM.
      </MethodBox>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {SCENARIOS.map(s=>(
          <button key={s.id} onClick={()=>setScenario(s.id)} style={{padding:"5px 12px",borderRadius:6,border:`1px solid ${scenario===s.id?s.color:"#1e293b"}`,background:scenario===s.id?"#0f172a":"transparent",color:scenario===s.id?s.color:"#64748b",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>
            {s.dir} {s.label}

      <ResponsiveContainer width="100%" height={420}>
        <ScatterChart margin={{top:20,right:30,bottom:20,left:20}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#1e293b"/>
          <XAxis type="number" dataKey="x" domain={[0,100]} label={{value:"Hedge Coverage (%)",position:"insideBottom",offset:-10,fill:"#475569",fontSize:11}} tick={{fill:"#475569",fontSize:10}}/>
          <YAxis type="number" dataKey="y" label={{value:"Adj Spread (¢/ASM)",angle:-90,position:"insideLeft",fill:"#475569",fontSize:11}} tick={{fill:"#475569",fontSize:10}}/>
          <ZAxis type="number" dataKey="z" range={[20,80]}/>
          <RechartTooltip content={({active,payload})=>{
            if(!active||!payload?.length) return null;
            const d=payload[0].payload;
            return <div style={{background:"#0f172a",border:"1px solid #1e293b",padding:"8px 12px",borderRadius:6,fontSize:11}}>
              <div style={{fontWeight:600,color:"#e5e7eb",marginBottom:4}}>{d.flag} {d.name}</div>
              <div style={{color:"#94a3b8"}}>Hedge: {d.x}%</div>
              <div style={{color:d.y>=0?"#34d399":"#ef4444"}}>Adj Spread: {d.y>=0?"+":""}{d.y}¢</div>
              <div style={{color:REGION_COLORS[d.region]}}>{d.region}</div>
            </div>;
          }}/>
          {Object.keys(REGION_COLORS).map(region=>(
            <Scatter key={region} name={REGION_LABELS[region]} data={data.filter(d=>d.region===region)} fill={REGION_COLORS[region]} shape={<CustomDot/>}/>
          ))}

      </ResponsiveContainer>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:8,justifyContent:"center"}}>
        {Object.entries(REGION_LABELS).map(([k,v])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#64748b"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:REGION_COLORS[k]}}/>
            {v}
          </div>
        ))}
      </div>

}

}

function TabMetrics() {
  const [sortKey,setSortKey] = useState("asm");
  const [sortAsc,setSortAsc] = useState(false);

  function toggleSort(k) {
    if(sortKey===k) setSortAsc(!sortAsc);
    else { setSortKey(k); setSortAsc(false); }
  }
  function arrow(k) {
    if(sortKey!==k) return "";
    return sortAsc ? " ▲" : " ▼";
  }
  function SortTh({k,label,right}) {
    return (
      <th onClick={()=>toggleSort(k)} style={{cursor:"pointer",userSelect:"none",textAlign:right?"right":"left"}}>
        <span style={{color:sortKey===k?"#60a5fa":"#64748b"}}>{label}{arrow(k)}</span>
      </th>
    );
  }

  const sorted = useMemo(()=>[...AIRLINES].sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(typeof av==="string") return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av-bv : bv-av;
  }),[sortKey,sortAsc]);

  return (
    <div>
      <MethodBox>
        <strong>Operating Metrics</strong> shows all unit economics for all 50 carriers. All values in US cents per Available Seat Mile (¢/ASM) unless noted.<br/><br/>
        <strong>Column definitions:</strong>
        <table style={{width:"100%",margin:"8px 0",fontSize:11,borderCollapse:"collapse"}}>
          <tbody>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>AIRLINE</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Carrier name. Sortable alphabetically.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>RGN</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Region code. NA=North America, EU=Europe, MENA, Asia, Oceania, LATAM.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>TICKER</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Stock ticker or "Private" for private carriers.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>TRASM</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Total Revenue per ASM (¢). All revenue streams ÷ capacity.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>PRASM</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Passenger Revenue per ASM (¢). Fare revenue only.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>FUEL CASM</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Fuel Cost per ASM (¢). Pre-conflict 2025 baseline. Doubles under Current scenario.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>CASM-EX</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>CASM excluding fuel (¢). Labor, maintenance, airports, admin costs.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>CASM</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}><em>Derived.</em> = Fuel CASM + CASM-ex. Total operating cost per ASM.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>$/GAL</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Pre-conflict base fuel cost per US gallon. Used to derive Fuel CASM.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b"}}>ASMs(B)</td><td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>Available Seat Miles in billions. Size proxy.</td></tr>
            <tr><td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap"}}>LF %</td><td style={{padding:"3px 8px",color:"#64748b"}}>Load Factor. % of seats occupied. Higher LF dilutes fixed costs per passenger.</td></tr>
          </tbody>
        </table>
        <strong>FX Rates used:</strong> EUR×1.08, GBP×1.26, JPY÷150, SGD×0.74, AUD×0.65, INR÷83, KRW÷1350, TWD÷32. ASK→ASM: ×0.6214.
      </MethodBox>
      <div style={{overflowX:"auto"}}>
        <table>
          <thead>
            <tr>
              <SortTh k="name" label="AIRLINE"/>
              <SortTh k="region" label="RGN"/>
              <SortTh k="ticker" label="TICKER"/>
              <SortTh k="trasm" label="TRASM" right/>
              <SortTh k="prasm" label="PRASM" right/>
              <SortTh k="fuelCasm" label="FUEL CASM" right/>
              <SortTh k="casmEx" label="CASM-EX" right/>
              <SortTh k="casm" label="CASM" right/>
              <SortTh k="fuelGal" label="$/GAL" right/>
              <SortTh k="asm" label="ASMs(B)" right/>
              <SortTh k="loadFactor" label="LF %" right/>
            </tr>
          </thead>
          <tbody>
            {sorted.map(a=>(
              <tr key={a.name}>
                <td><span style={{fontSize:12,marginRight:4}}>{a.flag}</span><span style={{color:"#e5e7eb",fontSize:12}}>{a.name}</span></td>
                <td><span style={{color:REGION_COLORS[a.region],fontWeight:600,fontSize:11}}>{a.region}</span></td>
                <td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#60a5fa"}}>{a.ticker}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#f0f9ff"}}>{fmt1(a.trasm)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94a3b8"}}>{fmt1(a.prasm)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#f97316"}}>{fmt1(a.fuelCasm)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94a3b8"}}>{fmt1(a.casmEx)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#e5e7eb"}}>{fmt1(a.casm)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94a3b8"}}>${a.fuelGal.toFixed(2)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94a3b8"}}>{a.asm.toFixed(1)}</td>
                <td style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#94a3b8"}}>{a.loadFactor}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

            {tiles.map((t,i)=>(
              <div key={i} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,padding:"8px 10px"}}>
                <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:0.8,marginBottom:3}}>{t.label}</div>
                <div style={{fontSize:16,fontWeight:700,color:"#f0f9ff",fontFamily:"'JetBrains Mono',monospace",marginBottom:2}}>{t.value}</div>
                <div style={{fontSize:11,color:t.subColor}}>{t.sub}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{maxWidth:1400,margin:"0 auto",padding:"0 24px"}}>
        <div style={{display:"flex",gap:0,borderBottom:"1px solid #1e293b",marginTop:16,marginBottom:16,overflowX:"auto"}}>
          {tabs.map((t,i)=>(
            <button key={i} onClick={()=>setTab(i)} style={{padding:"8px 14px",border:"none",borderBottom:tab===i?"2px solid #60a5fa":"2px solid transparent",background:"transparent",color:tab===i?"#60a5fa":"#64748b",cursor:"pointer",fontSize:12,fontWeight:tab===i?600:400,whiteSpace:"nowrap",fontFamily:"inherit",marginBottom:-1}}>
              {t}
            </button>
          ))}
        </div>
        <TabComponent/>
      </div>
    </div>
  );
}
</script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
