/* ─── MATH ─── */
function tenorDiscount(t) { return t > 0 ? Math.max(0, 1 - (24 - t) * 0.008) : 1; }
function calcAdj(a, jetPctUp) {
  const fuelHit = a.fuelCasm * jetPctUp * (1 - a.hedgePct * tenorDiscount(a.hedgeTenor));
  return (a.trasm - a.fuelCasm) - (a.casmEx + fuelHit);
}

/* ─── COLOUR HELPERS ─── */
function spreadColor(v) {
  if (v > 4)  return "#4ade80";
  if (v > 1)  return "#a3e635";
  if (v > -1) return "#facc15";
  if (v > -4) return "#fb923c";
  return "#f87171";
}
function hedgeBadge(pct, caution) {
  if (caution) return "badge-caution";
  if (pct >= 0.70) return "badge-green";
  if (pct >= 0.35) return "badge-yellow";
  if (pct > 0)     return "badge-orange";
  return "badge-red";
}

/* ─── TAB 1: RANKING TABLE ─── */
function Tab1({ airlines, scenario }) {
  const [sortBy, setSortBy] = useState("spread");
  const [sortDir, setSortDir] = useState(-1);
  const [regionFilter, setRegionFilter] = useState("ALL");

  const sorted = useMemo(() => {
    let arr = airlines.map(a => ({ ...a, adjSpread: calcAdj(a, scenario.jetPctUp) }));
    if (regionFilter !== "ALL") arr = arr.filter(x => x.region === regionFilter);
    arr.sort((a, b) => sortDir * ((sortBy === "spread" ? a.adjSpread - b.adjSpread : a[sortBy] - b[sortBy]) || 0));
    return arr;
  }, [airlines, scenario, sortBy, sortDir, regionFilter]);

  function toggleSort(col) {
    if (sortBy === col) setSortDir(d => -d);
    else { setSortBy(col); setSortDir(-1); }
  }

  const regions = ["ALL", "NA", "EU", "MENA", "Asia", "Oceania", "LATAM"];

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {regions.map(r => (
          <button key={r} className={`region-btn ${regionFilter===r?"active":""}`} onClick={()=>setRegionFilter(r)}>
            {r === "ALL" ? "All Regions" : REGION_LABELS[r] || r}
          </button>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <table>
          <thead>
            <tr>
              <th style={{width:32}}>#</th>
              <th>Airline</th>
              <th>Region</th>
              <th style={{cursor:"pointer"}} onClick={()=>toggleSort("hedgePct")}>Hedge % ↕</th>
              <th>Hedge Tenor</th>
              <th style={{cursor:"pointer"}} onClick={()=>toggleSort("trasm")}>TRASM ↕</th>
              <th style={{cursor:"pointer"}} onClick={()=>toggleSort("fuelCasm")}>Fuel CASM ↕</th>
              <th style={{cursor:"pointer"}} onClick={()=>toggleSort("spread")}>Adj Spread ↕</th>
              <th>Status</th>
              <th>Source Note</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((a, i) => {
              const sp = a.adjSpread;
              const pct = Math.min(100, Math.max(0, ((sp + 8) / 16) * 100));
              const sc = spreadColor(sp);
              return (
                <tr key={a.short}>
                  <td className="rank-cell">{i+1}</td>
                  <td className="name-cell">
                    <span className="flag">{a.flag}</span>{a.name}
                    {a.isPrivate && <span className="badge badge-gray" style={{marginLeft:6}}>PRIV</span>}
                    {a.cautionFlag && <span className="badge badge-caution" style={{marginLeft:4}}>⚠</span>}
                  </td>
                  <td><span style={{fontSize:11,color:"#888"}}>{REGION_LABELS[a.region]||a.region}</span></td>
                  <td>
                    <div className="hedge-bar-wrap">
                      <div className="hedge-bar-bg"><div className="hedge-bar-fill" style={{width:`${a.hedgePct*100}%`}}/></div>
                      <span className={`badge ${hedgeBadge(a.hedgePct, a.cautionFlag)}`}>{Math.round(a.hedgePct*100)}%</span>
                    </div>
                  </td>
                  <td><span className="mono" style={{color:"#aaa"}}>{a.hedgeTenor > 0 ? `${a.hedgeTenor}mo` : "—"}</span></td>
                  <td><span className="mono">{a.trasm.toFixed(2)}¢</span></td>
                  <td><span className="mono">{a.fuelCasm.toFixed(2)}¢</span></td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div className="spread-bar-wrap">
                        <div className="spread-bar-bg">
                          <div className="spread-bar-fill" style={{width:`${pct}%`,background:sc}}/>
                        </div>
                      </div>
                      <span className="mono" style={{color:sc,fontWeight:600}}>{sp > 0 ? "+" : ""}{sp.toFixed(2)}¢</span>
                    </div>
                  </td>
                  <td>
                    {sp > 4  && <span className="badge badge-green">RESILIENT</span>}
                    {sp > 1  && sp <= 4  && <span className="badge badge-yellow">STABLE</span>}

              );

  );

      </div>
      <div className="card">
        <div className="card-title">Most Hedged Carriers</div>
        <table>
          <thead>
            <tr><th>Carrier</th><th>Hedge %</th><th>Tenor</th><th>Adj Spread ({scenario.label})</th></tr>
          </thead>
          <tbody>
            {[...airlines].sort((a,b)=>b.hedgePct-a.hedgePct).slice(0,12).map(a => {
              const sp = calcAdj(a, scenario.jetPctUp);
              return (
                <tr key={a.short}>
                  <td><span className="flag">{a.flag}</span>{a.short}</td>
                  <td><span className={`badge ${hedgeBadge(a.hedgePct, a.cautionFlag)}`}>{Math.round(a.hedgePct*100)}%</span></td>
                  <td className="mono" style={{color:"#aaa"}}>{a.hedgeTenor > 0 ? `${a.hedgeTenor}mo` : "—"}</td>
                  <td className="mono" style={{color:spreadColor(sp)}}>{sp > 0 ? "+" : ""}{sp.toFixed(2)}¢</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ─── TAB 6: UNIT ECONOMICS ─── */
function Tab6({ airlines, scenario }) {
  const top20 = useMemo(() => {
    return [...airlines]
      .sort((a,b) => b.asm - a.asm)
      .slice(0, 20);
  }, [airlines]);

  const chartData = top20.map(a => ({
    name: a.short,
    flag: a.flag,
    TRASM: a.trasm,
    CASM_ex: a.casmEx,
    FuelCASM: a.fuelCasm,
    FuelHit: parseFloat((a.fuelCasm * scenario.jetPctUp * (1 - a.hedgePct * tenorDiscount(a.hedgeTenor))).toFixed(2))
  }));

  return (
    <div>
      <p style={{fontSize:12,color:"#777",marginBottom:12}}>Top 20 carriers by ASMs. Stacked bars: base non-fuel CASM + fuel CASM + unhedged fuel hit under {scenario.label}.</p>
      <ResponsiveContainer width="100%" height={380}>
        <BarChart data={chartData} margin={{top:10,right:20,bottom:40,left:10}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#1e1e28"/>
          <XAxis dataKey="name" tick={{fill:"#888",fontSize:11}} angle={-35} textAnchor="end" interval={0}/>
          <YAxis tick={{fill:"#666",fontSize:11}} unit="¢"/>
          <Tooltip contentStyle={{background:"#1a1a24",border:"1px solid #2a2a38",borderRadius:6,fontSize:12}}/>
          <Legend wrapperStyle={{fontSize:11,color:"#888"}}/>
          <Bar dataKey="CASM_ex"  name="CASM-ex"        stackId="cost" fill="#3b3b5c"/>
          <Bar dataKey="FuelCASM" name="Base Fuel CASM" stackId="cost" fill="#e85d24"/>
          <Bar dataKey="FuelHit"  name="Unhedged Fuel Hit" stackId="cost" fill="#a32d2d"/>
          <Bar dataKey="TRASM"    name="TRASM"          fill="#4ade8088" fillOpacity={0.5}/>
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ─── TAB 7: AUDIT TRAIL ─── */
function Tab7() {
  return (
    <div>
      <div className="section-hdr">Live Research Audit Trail — {AUDIT_CHUNKS.length} sources via Bigdata.com</div>
      {AUDIT_CHUNKS.map((c, i) => (
        <div className="audit-item" key={i}>
          <span className="audit-date">{c.date}</span>
          <span className="audit-src">{c.src}</span>
          <span className="audit-txt">{c.txt}</span>
        </div>
      ))}
      <div style={{marginTop:20,padding:16,background:"#111116",border:"1px solid #1e1e28",borderRadius:8,fontSize:12,color:"#666"}}>
        <strong style={{color:"#aaa"}}>Methodology:</strong> adjSpread = (TRASM − fuelCASM) − [CASM-ex + fuelCASM × jetPctUp × (1 − hedgePct × tenorDiscount)].
        tenorDiscount = hedgeTenor &gt; 0 ? max(0, 1 − (24 − hedgeTenor) × 0.008) : 1.
        Units: US¢/ASM. FX converted at: EUR×1.08, GBP×1.26, JPY÷150, SGD×0.74, AUD×0.65, INR÷83, KRW÷1350.
        Chinese carriers (Hainan, China Southern, China Eastern) forced to 0% hedge per CAAC regulation.
        Cathay Pacific: 30% crude-only — crack spread uncovered (⚠ caution flag).
        Moderate scenario (+50% jet fuel) = de-escalation / below current market.
        Data sourced from SEC 10-K filings, 20-F filings, earnings transcripts, and Bigdata.com news feed as of 2026-03-24.
      </div>
    </div>
  );
}

/* ─── MAIN APP ─── */
function App() {
  const [scenarioId, setScenarioId] = useState("current");
  const [tab, setTab] = useState(0);
  const scenario = SCENARIOS.find(s => s.id === scenarioId);

  const totalAirlines   = AIRLINES.length;
  const unhedgedCritical = AIRLINES.filter(a => a.hedgePct === 0).length;
  const avgHedge        = (AIRLINES.reduce((s,a) => s + a.hedgePct, 0) / AIRLINES.length * 100).toFixed(0);
  const avgSpread       = (AIRLINES.reduce((s,a) => s + calcAdj(a, scenario.jetPctUp), 0) / AIRLINES.length).toFixed(2);
  const jetFuelImpact   = scenario.jetPctUp * 100;

  const TABS = [
    "Resilience Ranking",
    "Scenario Matrix",
    "Hedge vs Spread",
    "Regional View",
    "Hedge Leaders",
    "Unit Economics",
    "Audit Trail"
  ];

  const tabComponents = [
    <Tab1 airlines={AIRLINES} scenario={scenario}/>,
    <Tab2 airlines={AIRLINES}/>,
    <Tab3 airlines={AIRLINES} scenario={scenario}/>,
    <Tab4 airlines={AIRLINES} scenario={scenario}/>,
    <Tab5 airlines={AIRLINES} scenario={scenario}/>,
    <Tab6 airlines={AIRLINES} scenario={scenario}/>,
    <Tab7/>
  ];

  return (
    <div className="app-shell">
      <div className="top-bar">
        <div className="top-bar-left">
          <div className="top-bar-logo">✈</div>
          <div>
            <span className="top-bar-title">Global Airlines — Iran Conflict Exposure</span>
            <span className="top-bar-sub">50 carriers | Bigdata.com live data</span>
          </div>
        </div>
        <div className="top-bar-right">
          <span className="live-badge">● LIVE</span>
          <span className="gen-ts">Generated: {GEN_TS}</span>
        </div>
      </div>

      <div className="scenario-bar">
        <span className="scenario-label">Scenario:</span>
        {SCENARIOS.map(s => (
          <button key={s.id}
            className={`scenario-btn ${scenarioId===s.id?"active":""}`}
            style={scenarioId===s.id ? {background:s.color+"22", borderColor:s.color, color:"#fff"} : {}}
            onClick={() => setScenarioId(s.id)}>
            {s.label} <span style={{opacity:0.7,fontSize:11}}>({s.sub})</span>
          </button>
        ))}
      </div>

      <div className="tiles-row">
        <div className="tile">
          <div className="tile-label">Airlines Covered</div>
          <div className="tile-val tile-neu">{totalAirlines}</div>
          <div className="tile-sub">35 public · 15 private</div>
        </div>
        <div className="tile">
          <div className="tile-label">Jet Fuel Shock ({scenario.label})</div>
          <div className="tile-val tile-up">+{jetFuelImpact}%</div>
          <div className="tile-sub">vs pre-conflict baseline</div>
        </div>
        <div className="tile">
          <div className="tile-label">Fleet-Avg Hedge</div>
          <div className="tile-val" style={{color:"#facc15"}}>{avgHedge}%</div>
          <div className="tile-sub">weighted by carrier count</div>
        </div>
        <div className="tile">
          <div className="tile-label">Avg Adj Spread</div>
          <div className="tile-val" style={{color:spreadColor(parseFloat(avgSpread))}}>
            {parseFloat(avgSpread) > 0 ? "+" : ""}{avgSpread}¢
          </div>
          <div className="tile-sub">{unhedgedCritical} carriers fully unhedged</div>
        </div>
      </div>

      <div className="tab-bar">
        {TABS.map((t, i) => (
          <button key={i} className={`tab-btn ${tab===i?"active":""}`} onClick={() => setTab(i)}>{t}</button>
        ))}
      </div>

      <div className="content">
        {tabComponents[tab]}
      </div>

      <div className="footer">
        <span>© 2026 Bigdata.com · Iran Conflict Airline Exposure Dashboard · {totalAirlines} carriers across 6 regions</span>
        <span>Data: SEC 10-K/20-F filings, earnings transcripts, news feed via Bigdata.com MCP · {AUDIT_CHUNKS.length} audit sources</span>
      </div>
    </div>
  );
}

const domRoot = ReactDOM.createRoot(document.getElementById("root"));
domRoot.render(React.createElement(App));
</script>
</body>
</html>
