// ─── CALCULATIONS ─────────────────────────────────────────────────────────────
function calcAdjSpread(airline, scenario) {
  const { trasm, fuelCasm, hedgePct, hedgeTenor } = airline;
  const { jetPctUp } = scenario;
  const rawSpread = trasm - fuelCasm;
  const fuelIncrease = fuelCasm * jetPctUp;
  const tenorDiscount = hedgeTenor > 0 ? Math.max(0, 1 - (24 - hedgeTenor) * 0.008) : 1;
  const hedgedProtection = fuelIncrease * hedgePct * tenorDiscount;
  const netFuelHit = fuelIncrease - hedgedProtection;
  return rawSpread - netFuelHit;
}

          <Legend wrapperStyle={{ paddingTop:"10px", fontSize:"12px", color:"#64748b" }} />
          {SCENARIOS.map(s => (
            <Bar key={s.id} dataKey={s.id} name={s.label} fill={s.color} opacity={0.85} radius={[2,2,0,0]} />
          ))}
        </BarChart>
      </ResponsiveContainer>
      <div style={{ marginTop:"12px", padding:"12px 16px", background:"#0f172a", borderRadius:"8px", border:"1px solid #1e293b", fontSize:"12px", color:"#64748b" }}>
        <strong style={{ color:"#ef4444" }}>Note:</strong> Red = Current scenario (+100%) reflects ACTUAL jet fuel prices as of March 24, 2026 — NW European jet fuel hit $1,730/mt (all-time high). Negative bars indicate airlines losing money on a unit-economics basis after fuel costs.
      </div>
    </div>
  );
}

function RegionViewTab({ airlines, scenario }) {
  const byRegion = useMemo(() => {
    const groups = {};
    airlines.forEach(a => {
      if (!groups[a.region]) groups[a.region] = [];
      groups[a.region].push({ ...a, adjSpread: calcAdjSpread(a, scenario) });
    });
    return groups;
  }, [airlines, scenario]);

  return (
    <div>
      <div style={S.sectionTitle}>Region View — {scenario.label}</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))", gap:"16px" }}>
        {Object.entries(byRegion).sort().map(([region, carriers]) => {
          const avgSpread = carriers.reduce((s,a) => s + a.adjSpread, 0) / carriers.length;
          const avgHedge = carriers.reduce((s,a) => s + a.hedgePct, 0) / carriers.length;
          const totalAsm = carriers.reduce((s,a) => s + a.asm, 0);
          const color = REGION_COLORS[region] || "#64748b";
          return (
            <div key={region} style={{...S.card, borderColor:`${color}44`}}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
                <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"14px", fontWeight:700, color }}>
                  {region}
                </div>
                <div style={{ fontSize:"11px", color:"#475569" }}>{carriers.length} carriers · {totalAsm.toFixed(0)}B ASMs</div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", marginBottom:"12px" }}>
                <div style={{ background:"#0a0f1e", borderRadius:"6px", padding:"8px 10px" }}>
                  <div style={{ fontSize:"10px", color:"#475569" }}>AVG SPREAD</div>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"14px", fontWeight:700, color: avgSpread > 0 ? "#34d399" : "#ef4444", marginTop:"2px" }}>{avgSpread.toFixed(2)}¢</div>
                </div>
                <div style={{ background:"#0a0f1e", borderRadius:"6px", padding:"8px 10px" }}>
                  <div style={{ fontSize:"10px", color:"#475569" }}>AVG HEDGE</div>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"14px", fontWeight:700, color:"#60a5fa", marginTop:"2px" }}>{Math.round(avgHedge*100)}%</div>
                </div>
                <div style={{ background:"#0a0f1e", borderRadius:"6px", padding:"8px 10px" }}>
                  <div style={{ fontSize:"10px", color:"#475569" }}>AT RISK</div>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"14px", fontWeight:700, color:"#f87171", marginTop:"2px" }}>{carriers.filter(a => a.adjSpread < 0).length}/{carriers.length}</div>
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:"4px" }}>
                {[...carriers].sort((a,b) => b.adjSpread - a.adjSpread).map(a => (
                  <div key={a.name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"4px 8px", background:"rgba(255,255,255,0.02)", borderRadius:"4px" }}>
                    <span style={{ fontSize:"12px", color:"#94a3b8" }}>{a.flag} {a.name}</span>
                    <SpreadChip val={a.adjSpread} />
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function OperatingMetricsTab({ airlines }) {
  return (
    <div>
      <div style={S.sectionTitle}>Operating Metrics — All 50 Carriers</div>
      <div style={{ overflowX:"auto" }}>
        <table style={S.table}>
          <thead>
            <tr>
              <th style={S.th}>Airline</th>
              <th style={S.th}>TRASM</th>
              <th style={S.th}>PRASM</th>
              <th style={S.th}>CASM</th>
              <th style={S.th}>Fuel CASM</th>
              <th style={S.th}>CASM-Ex</th>
              <th style={S.th}>$/Gal</th>
              <th style={S.th}>ASMs (B)</th>
              <th style={S.th}>LF%</th>
              <th style={S.th}>Hedge%</th>
              <th style={S.th}>Tenor</th>
              <th style={S.th}>Notes</th>
            </tr>
          </thead>
          <tbody>
            {airlines.map((a, i) => (
              <tr key={a.name} style={{ background: i % 2 === 0 ? "transparent" : "#080c14" }}>
                <td style={S.td}>
                  <div style={{ display:"flex", alignItems:"center", gap:"6px" }}>
                    <span>{a.flag}</span>
                    <div>
                      <div style={{ fontSize:"12px", fontWeight:500, color:"#e2e8f0" }}>{a.name}</div>
                      {a.parentGroup && <div style={{ fontSize:"10px", color:"#7c3aed" }}>↳ {a.parentGroup}</div>}
                    </div>
                  </div>
                </td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#60a5fa" }}>{a.trasm.toFixed(2)}¢</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#94a3b8" }}>{a.prasm ? a.prasm.toFixed(2)+"¢" : "—"}</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#94a3b8" }}>{a.casm.toFixed(2)}¢</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#f87171" }}>{a.fuelCasm.toFixed(2)}¢</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#94a3b8" }}>{a.casmEx.toFixed(2)}¢</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#94a3b8" }}>${a.fuelGal.toFixed(2)}</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#94a3b8" }}>{a.asm}</td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"12px", color:"#94a3b8" }}>{a.loadFactor}%</td>
                <td style={S.td}>
                  <HedgeBar pct={a.hedgePct} color={a.hedgePct>0.6?"#34d399":a.hedgePct>0.3?"#f97316":"#ef4444"} />
                </td>
                <td style={{...S.td, fontFamily:"'JetBrains Mono',monospace", fontSize:"11px", color:"#64748b" }}>{a.tenorLabel}</td>
                <td style={S.td}>
                  <div style={{ display:"flex", gap:"3px", flexWrap:"wrap" }}>
                    {a.isPrivate && <PrivateBadge />}
                    {a.parentGroup && <SubBadge parent={a.parentGroup} />}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [scenarioId, setScenarioId] = useState("current");
  const [region, setRegion] = useState("All");
  const [search, setSearch] = useState("");
  const [tab, setTab] = useState(0);

  const scenario = useMemo(() => SCENARIOS.find(s => s.id === scenarioId), [scenarioId]);

  const filtered = useMemo(() => {
    return AIRLINES.filter(a => {
      const matchRegion = region === "All" || a.region === region;
      const matchSearch = !search || a.name.toLowerCase().includes(search.toLowerCase()) || a.ticker.toLowerCase().includes(search.toLowerCase()) || a.country.toLowerCase().includes(search.toLowerCase());
      return matchRegion && matchSearch;
    });
  }, [region, search]);

  const TABS = ["Resilience Ranking","Hedge Positions","Risk vs Spread","Margin Impact","Region View","Operating Metrics"];

  return (
    <div style={S.app}>
      {/* HEADER */}
      <div style={S.header}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:"12px" }}>
          <div>
            <div style={S.h1}>✈ Global Airlines — Iran Conflict Fuel Exposure Dashboard</div>
            <div style={S.subtitle}>50 carriers · Live Bigdata.com data · Generated {GEN_TS}</div>
          </div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:"11px", color:"#ef4444", background:"#2d0808", border:"1px solid #ef444433", borderRadius:"6px", padding:"6px 12px", alignSelf:"flex-start" }}>
            ⚠ ACTIVE CONFLICT — Jet fuel +100% from baseline
          </div>
        </div>
        <div style={S.mktBar}>
          {[
            { label:"Brent Crude", val:"$98.40/bbl", change:"+82% YTD", up:true },
            { label:"Jet Fuel (NW EU)", val:"$1,730/mt", change:"+100% vs pre-conflict", up:true },
            { label:"Jet Crack Spread", val:"$38.50/bbl", change:"all-time high", up:true },
            { label:"Hormuz Status", val:"RESTRICTED", change:"Iran conflict active", up:false },
            { label:"IATA Cost Alert", val:"LEVEL 5", change:"Critical disruption", up:false },
          ].map(item => (
            <div key={item.label} style={S.mktItem}>
              <div style={S.mktLabel}>{item.label}</div>
              <div style={S.mktVal}>{item.val}</div>
              <div style={{...S.mktChange, color: item.up ? "#ef4444" : "#f97316"}}>{item.change}</div>
            </div>
          ))}
        </div>
      </div>

      {/* CONTROLS */}
      <div style={S.controls}>
        <div style={{ fontSize:"11px", color:"#475569", fontWeight:600 }}>SCENARIO:</div>
        {SCENARIOS.map(s => (
          <button key={s.id} style={S.scenBtn(scenarioId===s.id, s.color)} onClick={() => setScenarioId(s.id)} title={s.desc}>
            {s.label}
          </button>
        ))}
        <div style={{ width:"1px", height:"20px", background:"#1e293b", margin:"0 4px" }} />
        <div style={{ fontSize:"11px", color:"#475569", fontWeight:600 }}>REGION:</div>
        {REGIONS.map(r => (
          <button key={r} style={S.regionBtn(region===r)} onClick={() => setRegion(r)}>{r}</button>
        ))}
        <div style={{ width:"1px", height:"20px", background:"#1e293b", margin:"0 4px" }} />
        <input style={S.search} placeholder="Search airline…" value={search} onChange={e => setSearch(e.target.value)} />
        <div style={{ marginLeft:"auto", fontSize:"11px", color:"#334155" }}>
          Showing {filtered.length} of {AIRLINES.length} airlines
        </div>
      </div>

      {/* TABS */}
      <div style={S.tabs}>
        {TABS.map((t, i) => (
          <button key={t} style={S.tab(tab===i)} onClick={() => setTab(i)}>{t}</button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={S.content}>
        {tab === 0 && <ResilienceTab airlines={filtered} scenario={scenario} />}
        {tab === 1 && <HedgePositionsTab airlines={filtered} />}
        {tab === 2 && <RiskVsSpreadTab airlines={filtered} scenario={scenario} />}
        {tab === 3 && <MarginImpactTab airlines={filtered} />}
        {tab === 4 && <RegionViewTab airlines={filtered} scenario={scenario} />}
        {tab === 5 && <OperatingMetricsTab airlines={filtered} />}
      </div>

      {/* FOOTER */}
      <div style={S.footer}>
        <div style={{ marginBottom:"6px", color:"#475569" }}>
          <strong style={{ color:"#334155" }}>Methodology:</strong> Adjusted spread = (TRASM − Fuel CASM) − [Fuel CASM × jetPctUp × (1 − hedgePct × tenorDiscount)].
          tenorDiscount = max(0, 1 − (24 − hedgeTenor) × 0.008). Unit costs in USD cents per ASM; non-USD converted at EUR/USD 1.08, GBP/USD 1.26, JPY÷150, SGD×0.74, AUD×0.65, KRW÷1350.
          ASKs converted to ASMs × 0.6214. "Current" scenario (+100%) reflects actual NW European jet fuel price of $1,730/mt as of March 24, 2026.
          Data sourced from Bigdata.com filings, transcripts, news analysis, and company annual reports.
          Private carrier data marked (est). Subsidiaries use parent group hedging policies where subsidiary-specific data unavailable.
        </div>
        <div style={{ color:"#1e293b" }}>
          Powered by Bigdata.com · Dashboard auto-generated {GEN_TS} ·
          <a href="https://Bigdata-com.github.io/bigdata-dashboard-airline/" style={{ color:"#1e3a5f", marginLeft:"6px" }}>
            https://Bigdata-com.github.io/bigdata-dashboard-airline/
          </a>
        </div>
      </div>
    </div>
  );
}
  </script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
