function calcAdjSpread(airline, scenario) {
  const {trasm, fuelCasm, hedgePct, hedgeTenor} = airline;
  const {jetPctUp} = scenario;
  const rawSpread = trasm - fuelCasm;
  const fuelIncrease = fuelCasm * jetPctUp;
  const tenorDiscount = hedgeTenor > 0 ? Math.max(0, 1 - (24 - hedgeTenor) * 0.008) : 1;
  const hedgedProtection = fuelIncrease * hedgePct * tenorDiscount;
  const netFuelHit = fuelIncrease - hedgedProtection;
  return rawSpread - netFuelHit;
}

function HedgeBar({pct}) {
  const color = pct >= 0.6 ? "#34d399" : pct >= 0.3 ? "#f97316" : "#ef4444";
  return (
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <div style={{width:56,height:6,background:"#1e293b",borderRadius:3,overflow:"hidden"}}>
        <div style={{width:`${Math.min(100, pct*100)}%`,height:"100%",background:color,borderRadius:3}}/>
      </div>
      <span style={{fontSize:11,color,fontFamily:"JetBrains Mono",minWidth:36}}>{Math.round(pct*100)}%</span>
    </div>
  );
}

function SpreadChip({val}) {
  const color = val < -3 ? "#ef4444" : val < 0 ? "#f97316" : val < 3 ? "#facc15" : "#34d399";
  const bg = val < -3 ? "#2a0808" : val < 0 ? "#1a0800" : val < 3 ? "#1a1400" : "#001a0e";
  return (
    <span style={{display:"inline-block",padding:"2px 7px",borderRadius:4,background:bg,
                  color,fontFamily:"JetBrains Mono",fontSize:11,fontWeight:600}}>
      {val >= 0 ? "+" : ""}{val.toFixed(1)}¢
    </span>
  );
}

function StatusBadge({airline}) {
  const badges = [];
  if (airline.isPrivate) badges.push({label:"PRIVATE",color:"#fbbf24",bg:"#1a1200"});
  if (airline.parentGroup) badges.push({label:"SUB",color:"#a78bfa",bg:"#1a0f2e"});
  if (airline.hedgePct === 0) badges.push({label:"UNHEDGED",color:"#ef4444",bg:"#2a0808"});
  else if (airline.hedgePct < 0.3) badges.push({label:"PARTIAL",color:"#f97316",bg:"#1a0e00"});
  else if (airline.hedgePct < 0.6) badges.push({label:"PARTIAL",color:"#f97316",bg:"#1a0e00"});
  else badges.push({label:"HEDGED",color:"#34d399",bg:"#001a0e"});
  return (
    <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
      {badges.map(b => (
        <span key={b.label} style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:3,
          color:b.color,background:b.bg,letterSpacing:"0.4px"}}>{b.label}</span>
      ))}
    </div>
  );
}

function CautionBadge({airline}) {
  if (airline.hedgePct > 0 && airline.hedgePct < 0.6)
    return <span style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:3,color:"#facc15",background:"#1a1200",letterSpacing:"0.4px"}}>CAUTION</span>;
  return null;
}

function ResilienceTab({scenario}) {
  const [sortKey, setSortKey] = useState("hedgePct");
  const [sortAsc, setSortAsc] = useState(false);
  function toggleSort(k) {
    if (sortKey === k) setSortAsc(!sortAsc);
    else { setSortKey(k); setSortAsc(false); }
  }
  function arrow(k) {
    if (sortKey !== k) return <span style={{color:"#334155",marginLeft:3}}>⇅</span>;
    return <span style={{color:"#60a5fa",marginLeft:3}}>{sortAsc ? "▲" : "▼"}</span>;
  }
  const sorted = useMemo(() => {
    return [...AIRLINES].sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === "adjSpread") { av = calcAdjSpread(a, scenario); bv = calcAdjSpread(b, scenario); }
      if (sortKey === "region") return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortAsc ? av - bv : bv - av;
    });
  }, [sortKey, sortAsc, scenario]);
  function SortTh({k, label, style={}}) {
    return (
      <th onClick={()=>toggleSort(k)} style={{cursor:"pointer",userSelect:"none",padding:"8px 10px",

        <span style={{color:sortKey===k?"#60a5fa":"#64748b",fontSize:11,fontWeight:600}}>{label}{arrow(k)}</span>
      </th>
    );
  }
  const medals = ["🥇","🥈","🥉"];
  return (
    <div>
      <MethodBox>
        <strong>Resilience Ranking</strong> — Airlines ranked by fuel hedge coverage and adjusted spread under the selected scenario.<br/><br/>
        <strong>Column definitions:</strong>
        <table style={{width:"100%",margin:"8px 0",fontSize:11,borderCollapse:"collapse"}}>

            {[["RGN","Geographic region code. NA=North America, EU=Europe, MENA=Middle East & Africa, Asia=Asia-Pacific."],
              ["HEDGE %","% of annual fuel hedged with derivatives. Green ≥60%, orange 30–59%, red 0–29%."],
              ["TENOR","How far forward hedges extend. 12 mo = covered through ~same month next year."],
              ["TRASM","Total Revenue per ASM (¢). All passenger + cargo + ancillary revenue ÷ capacity."],
              ["FUEL CASM","Fuel Cost per ASM (¢). This component doubles under Current (+100%) scenario."],
              ["ADJ SPREAD","Derived. = (TRASM − FuelCASM) − (FuelCASM × jetPctUp × (1 − hedgePct × tenorDiscount)). Green = profitable per ASM."],
              ["STATUS","Hedge status badge: UNHEDGED (0%), PARTIAL (<60%), HEDGED (≥60%). CAUTION for crude-only hedges."],
            ].map(([col,desc]) => (
              <tr key={col}>
                <td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b",width:90}}>{col}</td>
                <td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>{desc}</td>
              </tr>
            ))}
          </tbody>
        </table>
        Default sort: Hedge % descending (highest hedge first).<br/>
        Adj Spread formula uses tenorDiscount = max(0, 1 − (24 − tenor) × 0.008).
      </MethodBox>
      <div className="tab-scroll">
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{borderBottom:"2px solid #1e293b"}}>

// ── TAB 3: Risk vs Spread ─────────────────────────────────────────────────────
function ScatterTab({scenario}) {
  const data = AIRLINES.map(a => ({
    name: a.name, region: a.region, flag: a.flag,
    x: Math.round(a.hedgePct * 100),
    y: parseFloat(calcAdjSpread(a, scenario).toFixed(2)),
    z: Math.sqrt(a.asm) * 1.5,
    ticker: a.ticker
  }));
  const CustomDot = (props) => {
    const {cx, cy, payload} = props;
    const color = REGION_COLORS[payload.region] || "#94a3b8";
    return <circle cx={cx} cy={cy} r={Math.max(4, Math.min(14, payload.z/3))} fill={color} fillOpacity={0.7} stroke={color} strokeWidth={1}/>;
  };
  const CustomTooltip = ({active, payload}) => {
    if (!active || !payload?.length) return null;
    const d = payload[0].payload;
    return (
      <div style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,padding:10,fontSize:11}}>
        <div style={{fontWeight:600,marginBottom:4}}>{d.flag} {d.name}</div>
        <div>Hedge: {d.x}% | Spread: {d.y >= 0 ? "+" : ""}{d.y}¢</div>
        <div style={{color:REGION_COLORS[d.region]}}>{REGION_LABELS[d.region]}</div>
      </div>
    );
  };
  return (
    <div>
      <MethodBox>
        <strong>Risk vs Spread</strong> — Each bubble represents one airline. X=hedge %, Y=adjusted spread (¢/ASM), bubble size ≈ √ASMs (capacity proxy).<br/><br/>
        Top-right = well-hedged and profitable. Bottom-left = unhedged and losing money per ASM under this scenario.
        Bubble color = region. Vertical line at 0 spread = breakeven boundary.
      </MethodBox>
      <div style={{marginBottom:10,display:"flex",flexWrap:"wrap",gap:8}}>
        {Object.entries(REGION_LABELS).map(([k,v]) => (
          <span key={k} style={{fontSize:11,display:"flex",alignItems:"center",gap:4}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:REGION_COLORS[k],display:"inline-block"}}/>
            <span style={{color:"#64748b"}}>{v}</span>
          </span>
        ))}
      </div>
      <ResponsiveContainer width="100%" height={420}>
        <ScatterChart margin={{top:20,right:20,bottom:20,left:0}}>
          <CartesianGrid stroke="#1e293b"/>
          <XAxis dataKey="x" name="Hedge %" type="number" domain={[0,100]} tickFormatter={v=>`${v}%`}
                 label={{value:"Hedge %",position:"bottom",fill:"#64748b",fontSize:11}} stroke="#334155" tick={{fill:"#64748b",fontSize:10}}/>
          <YAxis dataKey="y" name="Adj Spread" tickFormatter={v=>`${v}¢`}
                 label={{value:"Adj Spread (¢)",angle:-90,position:"left",fill:"#64748b",fontSize:11}} stroke="#334155" tick={{fill:"#64748b",fontSize:10}}/>
          <ZAxis dataKey="z" range={[20,200]}/>
          <ReferenceLine y={0} stroke="#ef4444" strokeDasharray="4 2" strokeOpacity={0.5}/>
          <Tooltip content={<CustomTooltip/>}/>
          <Scatter data={data} shape={<CustomDot/>}/>
        </ScatterChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── TAB 6: Operating Metrics ──────────────────────────────────────────────────
function MetricsTab() {
  const [sortKey, setSortKey] = useState("asm");
  const [sortAsc, setSortAsc] = useState(false);
  function toggleSort(k) {
    if (sortKey === k) setSortAsc(!sortAsc);
    else { setSortKey(k); setSortAsc(false); }
  }
  function arrow(k) {
    if (sortKey !== k) return <span style={{color:"#334155",marginLeft:2}}>⇅</span>;
    return <span style={{color:"#60a5fa",marginLeft:2}}>{sortAsc ? "▲" : "▼"}</span>;
  }
  const sorted = useMemo(() => {
    return [...AIRLINES].sort((a,b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortAsc ? av - bv : bv - av;
    });
  }, [sortKey, sortAsc]);
  function SortTh({k, label, right=false}) {
    return (
      <th onClick={()=>toggleSort(k)} style={{cursor:"pointer",userSelect:"none",padding:"7px 8px",
             background:"#0c1320",textAlign:right?"right":"left",whiteSpace:"nowrap"}}>
        <span style={{color:sortKey===k?"#60a5fa":"#64748b",fontSize:10,fontWeight:600}}>{label}{arrow(k)}</span>
      </th>
    );
  }
  return (
    <div>
      <MethodBox>
        <strong>Operating Metrics</strong> — Full unit economics for all 50 airlines in US cents per ASM.<br/><br/>
        <strong>Column definitions:</strong>
        <table style={{width:"100%",margin:"8px 0",fontSize:11,borderCollapse:"collapse"}}>
          <tbody>
            {[["AIRLINE","Carrier name. Click to sort alphabetically."],
              ["RGN","Geographic region. NA=North America, EU=Europe, MENA=Middle East & Africa."],
              ["TICKER","Exchange ticker or 'Private'."],
              ["TRASM","Total Revenue per ASM (¢). All revenue streams ÷ capacity."],
              ["PRASM","Passenger Revenue per ASM (¢). Fare revenue only."],
              ["FUEL CASM","Fuel Cost per ASM (¢). Doubles under Current scenario."],
              ["CASM-EX","CASM excluding fuel (¢). Labor, maintenance, airports, admin."],
              ["CASM","Derived. = Fuel CASM + CASM-ex. Total operating cost per ASM."],
              ["$/GAL","Pre-conflict base fuel cost per US gallon."],
              ["ASMs(B)","Available Seat Miles (billions). Carrier size proxy."],
              ["LF %","Load Factor — % of seats occupied."],
            ].map(([col,desc]) => (
              <tr key={col}>
                <td style={{padding:"3px 8px",color:"#94a3b8",fontWeight:600,whiteSpace:"nowrap",borderBottom:"1px solid #1e293b",width:80}}>{col}</td>
                <td style={{padding:"3px 8px",color:"#64748b",borderBottom:"1px solid #1e293b"}}>{desc}</td>
              </tr>
            ))}
          </tbody>
        </table>
        FX rates applied: EUR×1.08, GBP×1.26, JPY÷150, SGD×0.74, AUD×0.65, KRW÷1350, TWD÷32, NZD×0.62.<br/>
        ASK→ASM: ×0.6214. Data from public filings/tearsheets; UNVERIFIED for private carriers.
      </MethodBox>
      <div className="tab-scroll">
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
          <thead>
            <tr style={{borderBottom:"2px solid #1e293b"}}>
              <SortTh k="name" label="AIRLINE"/>
              <SortTh k="region" label="RGN"/>
              <SortTh k="ticker" label="TICKER"/>
              <SortTh k="trasm" label="TRASM" right/>
              <SortTh k="prasm" label="PRASM" right/>
              <SortTh k="fuelCasm" label="FUEL CASM" right/>
              <SortTh k="casmEx" label="CASM-EX" right/>
              <SortTh k="casm" label="CASM*" right/>
              <SortTh k="fuelGal" label="$/GAL" right/>
              <SortTh k="asm" label="ASMs(B)" right/>
              <SortTh k="loadFactor" label="LF%" right/>
            </tr>
          </thead>
          <tbody>
            {sorted.map((a,i) => (
              <tr key={a.name} style={{borderBottom:"1px solid #0f172a",background:i%2===0?"transparent":"#080c14"}}>
                <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}>
                  <span style={{marginRight:4}}>{a.flag}</span>{a.name}
                </td>
                <td style={{padding:"6px 8px"}}><span style={{color:REGION_COLORS[a.region],fontWeight:600,fontSize:10}}>{a.region}</span></td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",fontSize:10,color:"#64748b"}}>{a.ticker}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right"}}>{a.trasm.toFixed(2)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right",color:"#94a3b8"}}>{a.prasm.toFixed(2)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right",color:"#f97316"}}>{a.fuelCasm.toFixed(2)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right",color:"#94a3b8"}}>{a.casmEx.toFixed(2)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right"}}>{a.casm.toFixed(2)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right",color:"#64748b"}}>${a.fuelGal.toFixed(2)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right",color:"#60a5fa"}}>{a.asm.toFixed(1)}</td>
                <td style={{padding:"6px 8px",fontFamily:"JetBrains Mono",textAlign:"right",color:"#94a3b8"}}>{a.loadFactor.toFixed(1)}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:6,fontSize:10,color:"#475569"}}>* CASM = Fuel CASM + CASM-ex (Derived)</div>
    </div>
  );
}

              <div key={t.label} style={{background:"#080c14",border:"1px solid #1e293b",borderRadius:6,padding:"8px 10px"}}>
                <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:3}}>{t.label}</div>
                <div style={{fontFamily:"JetBrains Mono",fontSize:15,fontWeight:700,color:"#f0f9ff"}}>{t.value}</div>
                <div style={{fontSize:10,color:t.sub_color||"#f97316",marginTop:2}}>{t.sub}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
      {/* Tabs */}
      <div style={{maxWidth:1400,margin:"0 auto",padding:"0 24px"}}>
        <div style={{display:"flex",gap:0,borderBottom:"1px solid #1e293b",marginBottom:20,overflowX:"auto"}}>
          {tabs.map((t,i) => (
            <button key={t} onClick={()=>setTab(i)}
              style={{padding:"10px 16px",background:"transparent",border:"none",cursor:"pointer",
                      fontSize:12,fontWeight:tab===i?600:400,whiteSpace:"nowrap",
                      color:tab===i?"#60a5fa":"#64748b",
                      borderBottom:tab===i?"2px solid #60a5fa":"2px solid transparent",
                      marginBottom:-1}}>
              {t}
            </button>
          ))}
        </div>
        <div style={{paddingBottom:40}}>
          {tab===0 && <ResilienceTab scenario={scenario}/>}
          {tab===1 && <HedgeTab/>}
          {tab===2 && <ScatterTab scenario={scenario}/>}
          {tab===3 && <MarginTab/>}
          {tab===4 && <RegionTab scenario={scenario}/>}
          {tab===5 && <MetricsTab/>}
          {tab===6 && <AuditTab/>}
        </div>
      </div>
    </div>
  );
}
</script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
